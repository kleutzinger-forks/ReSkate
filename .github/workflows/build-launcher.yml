name: Build launcher
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset vs2022-x64
      - name: Build launcher
        run: cmake --build build/vs2022-x64 --config Release --target dingosdk_launcher --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: ReSkateLauncher
          path: build/vs2022-x64/Release/ReSkateLauncher.exe
